apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-clone
spec:
  params:
    - name: url
    - name: revision
      default: main
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:2.47.2
      env:
        - name: REPO_URL
          value: $(params.url)
        - name: REVISION
          value: $(params.revision)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        git clone --branch "$REVISION" --depth 1 "$REPO_URL" repo
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-check
spec:
  workspaces:
    - name: source
  steps:
    - name: lint-and-test
      image: python:3.11-slim
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: DATABASE_URI
          valueFrom:
            secretKeyRef: {name: accounts-test-db, key: uri}
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir -r requirements-dev.txt
        flake8 service tests
        pylint service --fail-under=9
        nosetests
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-build
spec:
  params:
    - name: image
    - name: tls-verify
      default: 'true'
  workspaces:
    - name: source
  volumes:
    - name: registry-auth
      secret:
        secretName: registry-credentials
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.39.3
      workingDir: $(workspaces.source.path)/repo
      securityContext:
        privileged: true
      volumeMounts:
        - name: registry-auth
          mountPath: /registry
      env:
        - name: IMAGE
          value: $(params.image)
        - name: TLS_VERIFY
          value: $(params.tls-verify)
      script: |
        #!/bin/sh
        set -eu
        buildah --storage-driver=vfs bud --isolation=chroot --format=docker -t "$IMAGE" .
        buildah --storage-driver=vfs push --tls-verify="$TLS_VERIFY" --authfile /registry/config.json "$IMAGE" "docker://$IMAGE"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: accounts-deploy
spec:
  params:
    - name: image
  workspaces:
    - name: source
  steps:
    - name: deploy
      image: alpine/k8s:1.32.2
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: IMAGE
          value: $(params.image)
      script: |
        #!/bin/sh
        set -eu
        kubectl apply -f k8s/accounts.yaml
        kubectl set image deployment/accounts accounts="$IMAGE"
        kubectl rollout status deployment/accounts --timeout=180s
        kubectl get deployments,pods,replicasets,services
