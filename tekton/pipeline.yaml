apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  params:
    - name: repo-url
    - name: branch
      default: main
    - name: image
  workspaces:
    - name: pipeline-workspace
  tasks:
    - name: clone
      taskRef: {name: accounts-clone}
      params:
        - {name: url, value: $(params.repo-url)}
        - {name: revision, value: $(params.branch)}
      workspaces:
        - {name: source, workspace: pipeline-workspace}
    - name: check
      runAfter: [clone]
      taskRef: {name: accounts-check}
      workspaces:
        - {name: source, workspace: pipeline-workspace}
    - name: build
      runAfter: [check]
      taskRef: {name: accounts-build}
      params:
        - {name: image, value: $(params.image)}
      workspaces:
        - {name: source, workspace: pipeline-workspace}
    - name: deploy
      runAfter: [build]
      taskRef: {name: accounts-deploy}
      params:
        - {name: image, value: $(params.image)}
      workspaces:
        - {name: source, workspace: pipeline-workspace}
