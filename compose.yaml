services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accounts
    volumes:
      - accounts-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d accounts]
      interval: 3s
      timeout: 3s
      retries: 20
  accounts:
    build: .
    image: customer-accounts:1.0
    ports: ['8080:8080']
    environment:
      DATABASE_URI: postgresql://postgres:postgres@postgres:5432/accounts
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  accounts-data:
