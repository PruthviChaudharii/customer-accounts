[nosetests]
tests=tests.test_models,tests.test_routes,tests.test_cli_commands
verbosity=2
with-coverage=1
cover-package=service
cover-erase=1
cover-min-percentage=95

[coverage:report]
show_missing=True
exclude_lines =
    pragma: no cover

[flake8]
max-line-length=127
exclude=.git,.venv,__pycache__
per-file-ignores =
    */__init__.py: F401 E402

[pylint.main]
ignore=.venv

[pylint.messages_control]
disable=E1101,too-few-public-methods,duplicate-code

[pylint.format]
max-line-length=127
